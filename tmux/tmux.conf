# Corregir colores para que Tokyonight se vea bien
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Habilitar el mouse (útil para redimensionar paneles)
set -g mouse on

# Modo vi para copy-mode (más natural viniendo de nvim)
set -g mode-keys vi

# Al seleccionar texto con el mouse y soltarlo, copiarlo directo
# al portapapeles del sistema (macOS) en vez de solo al buffer de tmux
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Copiar con 'y' en copy-mode (como en vim) también va al portapapeles
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Configurar el Prefix a Ctrl-b 
set -g prefix C-b
unbind C-a
bind-key C-b send-prefix

# Navegación inteligente entre paneles (Vim-Tmux-Navigator)
# Esto es lo que permite usar Ctrl + h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
